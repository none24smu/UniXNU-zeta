name: Duo Metal native GPU probe
on:
  workflow_dispatch:
    inputs:
      userspace_shell_only:
        description: Build only the root userspace POSIX shell and USB file bridge
        type: boolean
        default: false
      resource_snapshot_run:
        description: Replay actual retained resource SDK headers from a completed root CI run
        type: string
        default: ""
      frontend_only:
        description: Build only the isolated owned Metal frontend import candidate and readback probe
        type: boolean
        default: false
      spirv_only:
        description: Build only the owned AIR-to-SPIR-V native draw probe
        type: boolean
        default: false
      semantics_only:
        description: Run only the native ARM64 instruction semantics check
        type: boolean
        default: false
      cpu_probe_only:
        description: Build only the signed instruction probe
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  userspace-shell:
    if: inputs.userspace_shell_only
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build signed ordinary ARM64 userspace shell
        run: python3 experimental/userspace-shell/build.py --output userspace-shell
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: userspace-shell
          path: userspace-shell/
          if-no-files-found: error
          retention-days: 14
  instruction-semantics:
    if: inputs.semantics_only
    uses: ./.github/workflows/isa-semantics.yml
  instruction-probe:
    if: inputs.cpu_probe_only
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build signed baseline ARM64 instruction probe
        run: python3 experimental/isa-compat/build-probe.py --native-host-smoke --output isa-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isa-probe
          path: isa-probe/
          if-no-files-found: error
          retention-days: 14
  build:
    if: ${{ !inputs.userspace_shell_only && !inputs.semantics_only && !inputs.cpu_probe_only && !inputs.spirv_only && !inputs.frontend_only && inputs.resource_snapshot_run == '' }}
    runs-on: macos-26
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan API headers
        run: brew install vulkan-headers
      - name: Validate the encoder and build the signed iOS probe
        run: |
          export VULKAN_HEADERS_DIR="$(brew --prefix vulkan-headers)/include"
          bash experimental/duo-metal/run-host-tests.sh
          python3 experimental/duo-metal/build-probe.py --work "$RUNNER_TEMP/duo-metal-work" --output "$RUNNER_TEMP/duo-metal-probe"
      - name: Upload signed probe and build provenance
        uses: actions/upload-artifact@v4
        with:
          name: duo-metal-probe
          path: ${{ runner.temp }}/duo-metal-probe
          if-no-files-found: error
          retention-days: 14
      - name: Build baseline ARM64 instruction probe
        run: python3 experimental/isa-compat/build-probe.py --output "$RUNNER_TEMP/isa-probe"
      - name: Upload signed instruction probe
        uses: actions/upload-artifact@v4
        with:
          name: isa-probe
          path: ${{ runner.temp }}/isa-probe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AIR shader build tools
        run: |
          brew install meson ninja pkgconf bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          python3 -m pip install Mako PyYAML packaging
      - name: Build the isolated AIR shader backend and probe
        run: python3 experimental/duo-metal/build-air-shader-probe.py --work "$RUNNER_TEMP/air-shader-work" --output "$RUNNER_TEMP/air-shader-probe"
      - name: Upload signed AIR shader backend and probe
        uses: actions/upload-artifact@v4
        with:
          name: air-shader-probe
          path: ${{ runner.temp }}/air-shader-probe
          if-no-files-found: error
          retention-days: 14
      - name: Upload AIR build failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: air-shader-failure-logs
          path: ${{ runner.temp }}/air-shader-work/ios-build/meson-logs
          if-no-files-found: ignore

  build_spirv:
    if: inputs.spirv_only == true
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build signed bounded AIR-to-SPIR-V Vulkan draw probe
        run: python3 experimental/duo-metal/build-air-spirv-vulkan-probe.py --work "$RUNNER_TEMP/air-spirv-work" --output "$RUNNER_TEMP/air-spirv-probe"
      - uses: actions/upload-artifact@v4
        with:
          name: air-spirv-native-probe
          path: ${{ runner.temp }}/air-spirv-probe
          if-no-files-found: error
          retention-days: 14

  resource_sdk_replay:
    if: inputs.resource_snapshot_run != ''
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download retained actual kernel header closure
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: none24smu/UniXNU
          run-id: ${{ inputs.resource_snapshot_run }}
          name: unixnu-post-build-checks-zeta_userland_trust_defconfig
          path: resource-sdk-input
      - name: Reconstruct isolated source and replay exact SDK objects
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_RUN: ${{ inputs.resource_snapshot_run }}
        run: |
          root_commit=$(gh api "repos/none24smu/UniXNU/actions/runs/$SNAPSHOT_RUN" --jq .head_sha)
          python3 experimental/duo-metal/native/run-resource-sdk-replay.py --artifact resource-sdk-input --output resource-sdk-replay --root-commit "$root_commit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-sdk-replay
          path: resource-sdk-replay/
          if-no-files-found: error
          retention-days: 14

  build_external_frontend:
    if: inputs.frontend_only == true
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install owned fixture and target build tools
        run: |
          brew install llvm
          rustup toolchain install 1.98.0 --profile minimal --target aarch64-apple-ios
      - name: Build signed isolated frontend and owned actual MTL readback probe
        run: python3 experimental/duo-metal/build-external-frontend-probe.py --work "$RUNNER_TEMP/external-frontend-work" --output "$RUNNER_TEMP/external-frontend-probe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-frontend-native-probe
          path: ${{ runner.temp }}/external-frontend-probe/
          if-no-files-found: error
          retention-days: 14
