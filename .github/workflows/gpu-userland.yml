name: GPU userland
on:
  workflow_dispatch:
    inputs:
      trace_only:
        description: Compile only the small live diagnostic loader
        type: boolean
        default: false
      runner:
        description: macOS build and host-test runner
        type: choice
        options:
          - macos-latest
          - macos-26
          - macos-26-intel
          - macos-15
        default: macos-latest
      unixnu_ref:
        description: UniXNU ref (none24smu/UniXNU)
        required: true
        default: ios26-ufs-owner-root
permissions:
  contents: read
concurrency:
  group: gpu-userland-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ !inputs.trace_only }}
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 240
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4
        with:
          path: zeta
      - uses: actions/checkout@v4
        with:
          repository: none24smu/UniXNU
          ref: ${{ inputs.unixnu_ref }}
          path: unixnu
      - name: Check out the GPU submodules
        run: git -C unixnu submodule update --init --depth 1 drivers/NativeAdreno drivers/NativeMetal drivers/NativeMobileDisplay kits/AdrenoPM4 kits/ArmSmmu4K
      - name: Restore GPU compiler work
        uses: actions/cache/restore@v4
        id: gpu_cache
        with:
          path: |
            unixnu/.cache/mesa-work
            unixnu/.cache/gpu-reference/metal2vulkan
            unixnu/build/mesa-tu
            unixnu/build/mesa-tu-ios
            unixnu/build/m2v-target
          key: gpu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('unixnu/scripts/data/adreno-compiler-inputs.json', 'unixnu/scripts/data/gpu-metal-vulkan-inputs.json', 'unixnu/patches/mesa/*.patch') }}-${{ github.run_id }}
          restore-keys: |
            gpu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('unixnu/scripts/data/adreno-compiler-inputs.json', 'unixnu/scripts/data/gpu-metal-vulkan-inputs.json', 'unixnu/patches/mesa/*.patch') }}-
            gpu-${{ runner.os }}-${{ runner.arch }}-
      - name: Build Turnip, the Metal bridge and the plugin
        run: bash zeta/scripts/ci-gpu-userland.sh unixnu zeta "$RUNNER_TEMP/gpu-userland"
      - name: Save GPU compiler work
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            unixnu/.cache/mesa-work
            unixnu/.cache/gpu-reference/metal2vulkan
            unixnu/build/mesa-tu
            unixnu/build/mesa-tu-ios
            unixnu/build/m2v-target
          key: ${{ steps.gpu_cache.outputs.cache-primary-key }}
      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: gpu-userland
          path: ${{ runner.temp }}/gpu-userland
          if-no-files-found: error
          retention-days: 7
      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-userland-logs
          path: |
            unixnu/.cache/*.log
            unixnu/build/native-metal-bridge/*.log
            unixnu/build/zeta-heap-aliasing/*.log
            unixnu/build/turnip-darwin-host/*.log
            unixnu/build/zeta-display-cache/*.log
            unixnu/build/zeta-surface-planes/*.log
            unixnu/build/zeta-blit-subresources/*.log
            unixnu/build/zeta-msaa-resolve/*.log
            unixnu/build/zeta-submit-pressure/*.log
            unixnu/build/mesa-tu*/meson-logs/*.txt
          if-no-files-found: ignore
          retention-days: 7

  trace:
    if: ${{ inputs.trace_only }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile only the diagnostic loader
        run: |
          mkdir -p trace
          xcrun --sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=17.0 -dynamiclib -std=c++17 -fobjc-arc -O1 -Wall -Wextra -Werror -framework Foundation -framework Metal tools/MetalLiveTrace.mm -o trace/MetalLiveTrace
          codesign -s - --force --identifier org.blu-sharky.MetalLiveTrace trace/MetalLiveTrace
          codesign --verify --strict trace/MetalLiveTrace
          shasum -a 256 trace/MetalLiveTrace > trace/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: metal-live-trace
          path: trace
