[board]
name = "zeta"
soc = "SM8350"
description = "Microsoft Surface Duo 2"
kit = "zeta"                       # the package/ of this repository appears as kits/zeta in the build tree

# Target restore image: iPhone 17 Pro Max, iOS 26.5.2 (the newest iOS 26 whose kernel, xnu-12377.122.8,
# has published source near it: xnu-12377.121.6). The kernel builds from xnu-12377 (feeds.toml,
# UniXNU scripts/build-xnu-12377.sh); see [kernel]. Note that the iOS 26 OS and SystemOS images are
# Apple Encrypted Archives (.dmg.aea), which the userdata step does not decrypt.
[ipsw]
url = "https://updates.cdn-apple.com/2026SpringFCS/fullrestores/140-26432/CF51E589-7C43-4B55-B909-CF585DAD0570/iPhone18,2_26.5.2_23F84_Restore.ipsw"
product = "iPhone18,2"
version = "26.5.2"
build = "23F84"
device_class = "v54ap"
chip_id = 0x8150
board_id = 14
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]   # the small components

[ipsw.sha256]
# The source of the ADT identity (scripts/make-zeta-adt.py).
"DeviceTree.v54ap.im4p" = "9305d468d6a97f6e57842b5866359ad473434b5d507ea3e4b4123f29edda8218"

# Stage 1 and 2 (UEFI, UniXNU menu): the firmware comes from uefi-zeta, a Mu-Silicium tree with
# Platforms/Microsoft/zetaPkg. Its memory and configuration maps are generated from the stock slot b
# firmware by scripts/gen-zeta-memory-map.py and scripts/gen-zeta-config-map.py.
[firmware]
config = "zeta"                    # Resources/Configs/zeta.toml in the Mu-Silicium checkout (--uefi)
dsc = "Platforms/Microsoft/zetaPkg/zeta.dsc"
fd = "Build/zetaPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-zeta.py"]
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Microsoft",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "zeta"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "zeta-research"

# Kernel: DEVELOPMENT BCM2837 from xnu-12377 with UniXNU patches/xnu-12377 (zeta_defconfig selects the script).
# No [kernel.prelink] yet: the iPhone18,2 kernelcache is arm64e and NativePrelink takes plain arm64 only, so
# the kernel step builds and keeps the linked kernel without prelinking it.
[kernel]
outputs = ["build/xnu-12377.121.6/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"]

# Stage 3 (payload). The kernel and the trust cache do not exist yet (see [ipsw] above), so the payload
# cannot be built; the ADT tool can (scripts/make-zeta-adt.py, values from the phone and the stock tree).
[payload]
volume = "ZETAESP"
size_mib = 192
loader = "firmware"                 # DarwinBoot is in the uefi-zeta firmware volume
title = "zeta first boot: iPhone18,2 23F84"
dram_size = "0x200000000"           # 0x80000000..0x280000000; ABL /memory read on the phone (zetaPkg PORTING.md)
skip_setup_tool = "scripts/seed-data-skip-setup.py"   # base UniXNU script, used by --skip-setup
# panic_screen needs scripts/patch-xnu-entry-probe.py, which only sheng has; it is off until the kernel step.
# trust_cache_sha256 is set once the iPhone18,2 trust caches are extracted and bundled.
kernel_args = ["-v", "serial=3", "debug=0x14e"]

[payload.adt]
tool = "scripts/make-zeta-adt.py"
chip_id = "8350"                    # software seed for IOPlatformUUID (with unique_chip_id), not an Apple chip ID
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"   # stock /cpus; boot CPU MPIDR 0x81000000 (Aff1 0)
psci_method = "smc"                 # stock /psci
packed_data_ramdisk = true
unique_chip_id = "required"         # the platform seed is not stored in any repository
# owned_memory_size: DarwinBoot's default window (256 MiB) until UEFI hands over more DRAM.
# root_match_volume_uuid: set from the userdata OS volume once it is built.
