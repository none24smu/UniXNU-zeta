name: ARM64 instruction semantics
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  js-convert:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check actual ARM64 host
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          sysctl hw.optional.arm.FEAT_JSCVT
          clang --version
      - name: Compare FJCVTZS values and flags with native instruction
        run: python3 scripts/check-zeta-js-convert.py --native-apple --output native-js-convert
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-js-convert
          path: native-js-convert/
          if-no-files-found: error
          retention-days: 14
