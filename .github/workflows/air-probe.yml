name: Duo Metal native GPU probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan API headers
        run: brew install vulkan-headers
      - name: Validate the encoder and build the signed iOS probe
        run: |
          export VULKAN_HEADERS_DIR="$(brew --prefix vulkan-headers)/include"
          bash experimental/duo-metal/run-host-tests.sh
          python3 experimental/duo-metal/build-probe.py --work "$RUNNER_TEMP/duo-metal-work" --output "$RUNNER_TEMP/duo-metal-probe"
      - name: Upload signed probe and build provenance
        uses: actions/upload-artifact@v4
        with:
          name: duo-metal-probe
          path: ${{ runner.temp }}/duo-metal-probe
          if-no-files-found: error
          retention-days: 14
      - name: Build baseline ARM64 instruction probe
        run: python3 experimental/isa-compat/build-probe.py --output "$RUNNER_TEMP/isa-probe"
      - name: Upload signed instruction probe
        uses: actions/upload-artifact@v4
        with:
          name: isa-probe
          path: ${{ runner.temp }}/isa-probe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AIR shader build tools
        run: |
          brew install meson ninja pkgconf bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          python3 -m pip install Mako PyYAML packaging
      - name: Build the isolated AIR shader backend and probe
        run: python3 experimental/duo-metal/build-air-shader-probe.py --work "$RUNNER_TEMP/air-shader-work" --output "$RUNNER_TEMP/air-shader-probe"
      - name: Upload signed AIR shader backend and probe
        uses: actions/upload-artifact@v4
        with:
          name: air-shader-probe
          path: ${{ runner.temp }}/air-shader-probe
          if-no-files-found: error
          retention-days: 14
      - name: Upload AIR build failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: air-shader-failure-logs
          path: ${{ runner.temp }}/air-shader-work/ios-build/meson-logs
          if-no-files-found: ignore
