# zeta targets iOS 26.5.2 (23F84, xnu-12377.122.8), so its kernel builds from the iOS/macOS 26.5 release of
# the Apple sources instead of UniXNU's xnu-10063 set. These entries replace UniXNU's ones of the same name
# for this device only; scripts/build-xnu-12377.sh reads the versions through the unixnu driver.

[[source]]
name = "xnu"
kind = "refer"
git = "https://github.com/apple-oss-distributions/xnu.git"
ref = "xnu-12377.121.6"              # newest published xnu-12377 (2026-06-17)
commit = "ac9718fb1af618d5ce8678d0dc6e8a58f252216f"
darwin = "25.5.0"                    # uname of the 23F84 kernelcache: Darwin Kernel Version 25.5.0
version = "12377.121.6"

[[source]]
name = "libplatform"
kind = "refer"
git = "https://github.com/apple-oss-distributions/libplatform.git"
ref = "libplatform-375.120.2"        # same release as xnu-12377.121.6
commit = "b7ed7cf5cf7dd12b98672435db2225a860f199d8"

[[source]]
name = "libdispatch"
kind = "refer"
git = "https://github.com/apple-oss-distributions/libdispatch.git"
ref = "libdispatch-1542.100.32"      # newest published
commit = "701f4d1a24ae9c6863901bbbb22624b7d1b87321"

[[source]]
name = "AvailabilityVersions"
kind = "refer"
git = "https://github.com/apple-oss-distributions/AvailabilityVersions.git"
ref = "AvailabilityVersions-157.2"   # newest published
commit = "149b1777f3e8c2133042d8e188f72e3adf6a7110"
