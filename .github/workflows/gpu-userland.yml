name: GPU userland
on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS build and host-test runner
        type: choice
        options:
          - macos-latest
          - macos-26
          - macos-26-intel
          - macos-15
        default: macos-latest
      unixnu_ref:
        description: UniXNU ref (none24smu/UniXNU)
        required: true
        default: ios26-ufs-owner-root
permissions:
  contents: read
concurrency:
  group: gpu-userland-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 240
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4
        with:
          path: zeta
      - uses: actions/checkout@v4
        with:
          repository: none24smu/UniXNU
          ref: ${{ inputs.unixnu_ref }}
          path: unixnu
      - name: Check out the GPU submodules
        run: git -C unixnu submodule update --init --depth 1 drivers/NativeAdreno drivers/NativeMetal drivers/NativeMobileDisplay kits/AdrenoPM4 kits/ArmSmmu4K
      - name: Build Turnip, the Metal bridge and the plugin
        run: bash zeta/scripts/ci-gpu-userland.sh unixnu zeta "$RUNNER_TEMP/gpu-userland"
      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: gpu-userland
          path: ${{ runner.temp }}/gpu-userland
          if-no-files-found: error
          retention-days: 7
      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-userland-logs
          path: |
            unixnu/.cache/*.log
            unixnu/build/native-metal-bridge/*.log
            unixnu/build/zeta-heap-aliasing/*.log
            unixnu/build/mesa-tu*/meson-logs/*.txt
          if-no-files-found: ignore
          retention-days: 7
