name: Metal live trace loader
on:
  workflow_dispatch:
jobs:
  loader:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile only the diagnostic loader
        run: |
          mkdir -p trace
          xcrun --sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=17.0 -dynamiclib -std=c++17 -fobjc-arc -O1 -Wall -Wextra -Werror -framework Foundation -framework Metal tools/MetalLiveTrace.mm -o trace/MetalLiveTrace
          codesign -s - --force --identifier org.blu-sharky.MetalLiveTrace trace/MetalLiveTrace
          codesign --verify --strict trace/MetalLiveTrace
          shasum -a 256 trace/MetalLiveTrace > trace/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: metal-live-trace
          path: trace
